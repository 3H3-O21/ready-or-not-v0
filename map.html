<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FPS Test</title>

<style>

body{
    margin:0;
    overflow:hidden;
}

canvas{
    display:block;
}

#startScreen{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
    font-size:30px;
    cursor:pointer;
}

#crosshair{
    position:absolute;

    width:6px;
    height:6px;

    background:white;
    border-radius:50%;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    pointer-events:none;

    z-index:1000;
}

#interactionText{
    position:absolute;

    left:50%;
    top:58%;

    transform:translateX(-50%);

    color:white;

    font-family:Arial;

    font-size:20px;

    text-shadow:0 0 5px black;

    pointer-events:none;

    z-index:1000;

    display:none;
}

</style>

</head>

<body>

<div id="startScreen">
Clique pour commencer
</div>
<div id="crosshair"></div>
<div id="interactionText"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const scene = new THREE.Scene();
const raycaster = new THREE.Raycaster();
const centerScreen = new THREE.Vector2(0,0);

scene.background = new THREE.Color(0x555555);

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(0,1.8,10);

const renderer = new THREE.WebGLRenderer();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(renderer.domElement);

// ---------- LUMIERES ----------
const light = new THREE.DirectionalLight(0xffffff,3);
light.position.set(10,20,10);
scene.add(light);

// lumière ambiante pour que l'intérieur ne soit pas noir
scene.add(new THREE.AmbientLight(0xffffff,1.2));

// ---------- SOL ----------
const floor = new THREE.Mesh(
new THREE.PlaneGeometry(200,200),
new THREE.MeshStandardMaterial({ color:0x808080 })
);

floor.rotation.x = -Math.PI/2;
scene.add(floor);

// surfaces sur lesquelles on peut marcher (sol + maison + escaliers)
const groundMeshes = [floor];

// ---------- MAISON (avec collisions) ----------
let house = null;

// tous les meshes de la maison qui bloquent le joueur
const collisionMeshes = [];

const loader = new GLTFLoader();

loader.load(

"./models/maison_test.glb",

function(gltf){

house = gltf.scene;

house.position.set(0,0,0);
house.scale.set(100,100,100);

scene.add(house);

// la matrice doit être à jour AVANT les collisions
house.updateMatrixWorld(true);

house.traverse((obj)=>{

if(obj.isMesh){

// SketchUp exporte souvent des faces à un seul côté :
// DoubleSide permet de les détecter des deux côtés
if(Array.isArray(obj.material)){
obj.material.forEach(m => m.side = THREE.DoubleSide);
}else{
obj.material.side = THREE.DoubleSide;
}

collisionMeshes.push(obj);
groundMeshes.push(obj);

}

});

const box = new THREE.Box3().setFromObject(house);

console.log("Maison GLB chargée");
console.log("Meshes de collision :", collisionMeshes.length);
console.log("Taille :", box.getSize(new THREE.Vector3()));
console.log("Centre :", box.getCenter(new THREE.Vector3()));

},

undefined,

function(error){
console.error("Erreur GLB :", error);
}

);

// ---------- PORTE DE TEST ----------
const interactables = [];

const doorMaterial = new THREE.MeshStandardMaterial({ color:0x663300 });

const door = new THREE.Mesh(
new THREE.BoxGeometry(1,3,0.15),
doorMaterial
);

door.position.set(0,1.5,-15);
door.userData.type = "door";

scene.add(door);
interactables.push(door);

// ---------- ETAT DU JOUEUR ----------
const keys = {};
const PLAYER_RADIUS = 0.5;
let doorOpen = false;
let targetDoorRotation = 0;
let lookingAtDoor = false;

document.addEventListener("keydown",(e)=>{

const key = e.key.toLowerCase();

keys[key] = true;

if(key === "f" && lookingAtDoor){
doorOpen = !doorOpen;
targetDoorRotation = doorOpen ? -Math.PI/2 : 0;
}

if(key === "control"){
isCrouching = true;
}

if(key === "q"){
leanDirection = 1;
}

if(key === "e"){
leanDirection = -1;
}

});

document.addEventListener("keyup",(e)=>{

const key = e.key.toLowerCase();

keys[key] = false;

if(key === "control"){
isCrouching = false;
}

if(key === "q"){
leanDirection = 0;
}

if(key === "e"){
leanDirection = 0;
}

});

let yaw = 0;
let pitch = 0;

let isCrouching = false;
let leanDirection = 0;

const WALK_SPEED = 0.06;
const RUN_SPEED = 0.10;

const STAND_HEIGHT = 1.8;
const CROUCH_HEIGHT = 1.1;

// position des pieds et vitesse verticale (gravité)
let feetY = 0;
let velY = 0;
let eyeOffset = STAND_HEIGHT;

// hauteur maximale d'une marche qu'on peut monter (en mètres)
const STEP_HEIGHT = 0.5;
const GRAVITY = 0.01;

const LEAN_ANGLE = 0.15;

document
.getElementById("startScreen")
.addEventListener("click",()=>{

document.body.requestPointerLock();

document.getElementById("startScreen").style.display = "none";

});

document.addEventListener("mousemove",(e)=>{

if(document.pointerLockElement === document.body){

yaw -= e.movementX * 0.002;
pitch -= e.movementY * 0.002;

pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));

camera.rotation.order = "YXZ";
camera.rotation.y = yaw;
camera.rotation.x = pitch;

}

});

// ---------- COLLISIONS ----------
const collisionRaycaster = new THREE.Raycaster();
const UP = new THREE.Vector3(0,1,0);

// hauteurs (au-dessus des pieds) auxquelles on teste les murs.
// Le premier rayon est juste au-dessus de STEP_HEIGHT : les marches
// plus basses ne bloquent pas, on peut les monter.
const RAY_HEIGHTS = [0.55, 1.0, 1.5];

const groundRaycaster = new THREE.Raycaster();
const DOWN = new THREE.Vector3(0,-1,0);

// retourne la hauteur du sol sous le joueur, ou null s'il n'y en a pas
function getGroundY(x, z, fy){

groundRaycaster.set(
new THREE.Vector3(x, fy + STEP_HEIGHT, z),
DOWN
);

groundRaycaster.far = STEP_HEIGHT + 0.3;

const hits = groundRaycaster.intersectObjects(groundMeshes, false);

return hits.length > 0 ? hits[0].point.y : null;

}

// angles autour de la direction du mouvement (évite de passer dans les coins)
const RAY_ANGLES = [0, 0.6, -0.6];

// retourne true si un mur bloque le déplacement dans cette direction
function isBlocked(x, z, dirX, dirZ, distance, fy){

if(collisionMeshes.length === 0) return false;

const baseDir = new THREE.Vector3(dirX,0,dirZ).normalize();

collisionRaycaster.far = PLAYER_RADIUS + distance;

for(const h of RAY_HEIGHTS){

for(const angle of RAY_ANGLES){

const dir = baseDir.clone().applyAxisAngle(UP, angle);

collisionRaycaster.set(
new THREE.Vector3(x, fy + h, z),
dir
);

const hits = collisionRaycaster.intersectObjects(collisionMeshes, false);

if(hits.length > 0){
return true;
}

}

}

return false;

}

// ---------- BOUCLE PRINCIPALE ----------
function animate(){

requestAnimationFrame(animate);

const speed = keys["shift"] ? RUN_SPEED : WALK_SPEED;

const direction = new THREE.Vector3();

camera.getWorldDirection(direction);

direction.y = 0;
direction.normalize();

const right = new THREE.Vector3();

right.crossVectors(direction, new THREE.Vector3(0,1,0));

// déplacement voulu
let moveX = 0;
let moveZ = 0;

if(keys["w"]){
moveX += direction.x * speed;
moveZ += direction.z * speed;
}

if(keys["s"]){
moveX -= direction.x * speed;
moveZ -= direction.z * speed;
}

if(keys["a"]){
moveX -= right.x * speed;
moveZ -= right.z * speed;
}

if(keys["d"]){
moveX += right.x * speed;
moveZ += right.z * speed;
}

// axe X puis axe Z séparément : permet de glisser le long des murs
if(moveX !== 0){

if(!isBlocked(
camera.position.x,
camera.position.z,
Math.sign(moveX),
0,
Math.abs(moveX),
feetY
)){
camera.position.x += moveX;
}

}

if(moveZ !== 0){

if(!isBlocked(
camera.position.x,
camera.position.z,
0,
Math.sign(moveZ),
Math.abs(moveZ),
feetY
)){
camera.position.z += moveZ;
}

}

// sol sous les pieds : permet de monter les marches et de tomber
const groundY = getGroundY(camera.position.x, camera.position.z, feetY);

if(groundY !== null){

velY = 0;

const diff = groundY - feetY;

// montée/descente fluide (évite l'effet de saccade sur les marches)
feetY = Math.abs(diff) < 0.01 ? groundY : feetY + diff * 0.35;

}else{

// plus de sol : on tombe
velY -= GRAVITY;
feetY += velY;

if(feetY < 0){
feetY = 0;
velY = 0;
}

}

// accroupi
const targetHeight = isCrouching ? CROUCH_HEIGHT : STAND_HEIGHT;

eyeOffset += (targetHeight - eyeOffset) * 0.15;

camera.position.y = feetY + eyeOffset;

// penché
const targetLean = leanDirection * LEAN_ANGLE;

camera.rotation.z += (targetLean - camera.rotation.z) * 0.12;

// interaction (porte)
raycaster.setFromCamera(centerScreen, camera);

const intersects = raycaster.intersectObjects(interactables);

lookingAtDoor = false;

document.getElementById("interactionText").style.display = "none";

if(intersects.length > 0){

const hit = intersects[0].object;

if(hit.userData.type === "door"){

lookingAtDoor = true;

document.getElementById("interactionText").innerText = "[F] Ouvrir";
document.getElementById("interactionText").style.display = "block";

}

}

door.rotation.y += (targetDoorRotation - door.rotation.y) * 0.08;

renderer.render(scene, camera);

}

animate();

window.addEventListener("resize",()=>{

camera.aspect = window.innerWidth / window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

});

</script>

</body>
</html>
