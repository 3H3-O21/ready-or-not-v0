<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FPS Test</title>

<style>

body{
    margin:0;
    overflow:hidden;
}

canvas{
    display:block;
}

#startScreen{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
    font-size:30px;
    cursor:pointer;
}

</style>

</head>

<body>

<div id="startScreen">
Clique pour commencer
</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0x555555);

const camera =
new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(
0,
1.8,
10
);

const renderer =
new THREE.WebGLRenderer();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(
renderer.domElement
);

const light =
new THREE.DirectionalLight(
0xffffff,
3
);

light.position.set(
10,
20,
10
);

scene.add(light);

const floor =
new THREE.Mesh(
new THREE.PlaneGeometry(30,30),
new THREE.MeshStandardMaterial({
color:0x808080
})
);

floor.rotation.x =
-Math.PI/2;

scene.add(floor);

const wallMaterial =
new THREE.MeshStandardMaterial({
color:0xbbbbbb
});

const walls = [];
function createWall(x,z,w,d){

const wall =
new THREE.Mesh(
new THREE.BoxGeometry(w,4,d),
wallMaterial
);

wall.position.set(
x,
2,
z
);

scene.add(wall);

const box =
new THREE.Box3().setFromObject(
wall
);

walls.push(box);

}

createWall(0,-15,30,1);
createWall(0,15,30,1);
createWall(-15,0,1,30);
createWall(15,0,1,30);

const keys = {};
const PLAYER_RADIUS = 0.5;

document.addEventListener(
"keydown",
(e)=>{
const key = e.key.toLowerCase();

keys[key] = true;

if(key === "control"){
isCrouching = true;
}

if(key === "q"){
leanDirection = -1;
}

if(key === "e"){
leanDirection = 1;
}
}
);

document.addEventListener(
"keyup",
(e)=>{
const key = e.key.toLowerCase();

keys[key] = false;

if(key === "control"){
isCrouching = false;
}

if(key === "q" && leanDirection === -1){
leanDirection = 0;
}

if(key === "e" && leanDirection === 1){
leanDirection = 0;
}
}
);

let yaw = 0;
let pitch = 0;

let isCrouching = false;
let leanDirection = 0;

const WALK_SPEED = 0.06;
const RUN_SPEED = 0.10;

const STAND_HEIGHT = 1.8;
const CROUCH_HEIGHT = 1.1;

const LEAN_AMOUNT = 0.3;
const LEAN_ANGLE = 0.15;
document
.getElementById("startScreen")
.addEventListener(
"click",
()=>{

document.body
.requestPointerLock();

document
.getElementById("startScreen")
.style.display="none";

}
);

document.addEventListener(
"mousemove",
(e)=>{

if(
document.pointerLockElement
=== document.body
){

yaw -= e.movementX * 0.002;

pitch -= e.movementY * 0.002;

pitch = Math.max(
-Math.PI/2,
Math.min(
Math.PI/2,
pitch
)
);

camera.rotation.order =
"YXZ";

camera.rotation.y = yaw;
camera.rotation.x = pitch;

}

}
);
function checkCollision(x,z){

for(const wall of walls){

const playerBox =
new THREE.Box3(
new THREE.Vector3(
x - PLAYER_RADIUS,
0,
z - PLAYER_RADIUS
),
new THREE.Vector3(
x + PLAYER_RADIUS,
2,
z + PLAYER_RADIUS
)
);

if(playerBox.intersectsBox(wall)){

return true;

}

}

return false;

}
function animate(){

requestAnimationFrame(
animate
);

const speed =
keys["shift"]
? RUN_SPEED
: WALK_SPEED;
let nextX = camera.position.x;
let nextZ = camera.position.z;

const direction =
new THREE.Vector3();

camera.getWorldDirection(
direction
);

direction.y = 0;
direction.normalize();

const right =
new THREE.Vector3();

right.crossVectors(
direction,
new THREE.Vector3(0,1,0)
);

if(keys["w"]){

nextX += direction.x * speed;
nextZ += direction.z * speed;

}

if(keys["s"]){

nextX -= direction.x * speed;
nextZ -= direction.z * speed;

}

if(keys["a"]){

nextX -= right.x * speed;
nextZ -= right.z * speed;

}

if(keys["d"]){

nextX += right.x * speed;
nextZ += right.z * speed;

}

if(!checkCollision(
nextX,
camera.position.z
)){

camera.position.x = nextX;

}

if(!checkCollision(
camera.position.x,
nextZ
)){

camera.position.z = nextZ;

}
const targetHeight =
isCrouching
? CROUCH_HEIGHT
: STAND_HEIGHT;

camera.position.y +=
(targetHeight - camera.position.y)
* 0.15;

camera.position.x +=
(
leanDirection * LEAN_AMOUNT
-
(
camera.position.x -
Math.round(camera.position.x)
)
)
* 0.05;

camera.rotation.z =
leanDirection * LEAN_ANGLE;

renderer.render(
scene,
camera
);

}

animate();

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
