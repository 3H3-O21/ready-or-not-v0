<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carte 3D Test</title>

<style>

body{
    margin:0;
    overflow:hidden;
}

canvas{
    display:block;
}

</style>

</head>

<body>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x555555);

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(0,5,15);

const renderer = new THREE.WebGLRenderer();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(
renderer.domElement
);

const light = new THREE.DirectionalLight(
0xffffff,
3
);

light.position.set(
10,
20,
10
);

scene.add(light);

const floorGeometry =
new THREE.PlaneGeometry(
30,
30
);

const floorMaterial =
new THREE.MeshStandardMaterial({
color:0x808080
});

const floor =
new THREE.Mesh(
floorGeometry,
floorMaterial
);

floor.rotation.x =
-Math.PI/2;

scene.add(floor);

const wallMaterial =
new THREE.MeshStandardMaterial({
color:0xbbbbbb
});

function createWall(x,z,w,d){

const wallGeometry =
new THREE.BoxGeometry(
w,
4,
d
);

const wall =
new THREE.Mesh(
wallGeometry,
wallMaterial
);

wall.position.set(
x,
2,
z
);

scene.add(wall);

}

createWall(0,-15,30,1);
createWall(0,15,30,1);
createWall(-15,0,1,30);
createWall(15,0,1,30);

function animate(){

requestAnimationFrame(
animate
);

renderer.render(
scene,
camera
);

}

animate();

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
