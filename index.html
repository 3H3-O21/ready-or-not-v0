<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ready Or Not V0</title>

<style>

body{
    margin:0;
    height:100vh;
    background:#5c5c5c;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
}

.menu{
    display:flex;
    align-items:center;
    gap:140px;
}

.menu-button{
    width:220px;
    height:220px;
    
    border:none;
    border-radius:15px;
    
    background:#cfcfcf;
    
    font-size:22px;
    
    cursor:pointer;

    transition:0.2s;
}

.start-button{
    width:220px;
    height:120px;
    
    border:none;
    border-radius:15px;
    
    background:#cfcfcf;
    
    font-size:22px;
    
    cursor:pointer;

    transition:0.2s;
}

.menu-button:hover,
.start-button:hover{
    transform:scale(1.05);
    background:#dddddd;
}

</style>

</head>

<body>

<div class="menu">

    <button class="menu-button">
        MAP
    </button>

    <button class="start-button">
        Commencer
    </button>

    <button class="menu-button">
        ÉQUIPEMENT
    </button>

</div>

</body>
</html>
